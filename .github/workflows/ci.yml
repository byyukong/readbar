name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 测试只依赖 runtime 依赖；跳过 devDependencies 可以绕开 vsce -> keytar 的原生编译
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npm test
