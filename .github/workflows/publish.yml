# 推送 v* tag → 测试 → 打包 VSIX → 发布到 Marketplace → 创建 GitHub Release
# 认证用 Trusted Publishing（OIDC），仓库里不存任何密钥。
# 前置条件：Marketplace publisher 页面 → Trusted Publishing → 建策略，
# 仓库填 byyukong/readbar，workflow 填 publish.yml
name: publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release
      id-token: write # Marketplace OIDC 交换
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 只装运行时依赖：devDependencies 里的 @vscode/vsce-sign 在 Linux 上会搞崩 npm
      - name: 安装依赖
        run: npm ci --omit=dev --no-audit --no-fund

      - name: 自动测试
        run: npm test

      - name: 安装 vsce
        run: npm i -g @vscode/vsce@4.1.0 --ignore-scripts --no-audit --no-fund

      - name: 打包 VSIX
        run: vsce package

      - name: 发布到 VS Code Marketplace
        run: vsce publish --oidc --skip-duplicate

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          # 从 CHANGELOG.md 抽当前版本的段落当发布说明
          NOTES=$(awk -v ver="$VER" '
            $0 ~ "^## " ver {print; flag=1; next}
            flag && /^## / {exit}
            flag {print}
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then NOTES=$(git log -1 --pretty=%B); fi
          printf '%s\n' "$NOTES" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" readbar-*.vsix --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag readbar-*.vsix
          fi
